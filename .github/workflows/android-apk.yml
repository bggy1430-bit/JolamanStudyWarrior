name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install npm dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Generate Android app icon when source exists
        run: |
          if [ -f assets/logo.png ]; then
            npx @capacitor/assets generate --android --iconBackgroundColor '#39A9F5' --iconBackgroundColorDark '#39A9F5'
          else
            echo "assets/logo.png not present; using default Capacitor icon for this build."
          fi

      - name: Sync web app to Android
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jolaman-study-warrior-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
