name: Apply spouse and awakening patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('www/index.html'); s=p.read_text(encoding='utf-8')
          marker='<!-- SPOUSE_AWAKEN_PATCH_2026_09_24 -->'
          if marker in s: raise SystemExit(0)
          patch=r'''\n<!-- SPOUSE_AWAKEN_PATCH_2026_09_24 -->\n<script>\n(function(){\n  try{\n    if(typeof SPOUSE_PRESETS!=='undefined' && !SPOUSE_PRESETS.some(x=>x.id==='solaris')){\n      const extra=[\n        {id:'solaris',grade:11,name:'솔라리스',title:'천륜의 태양',ic:'🌞',bonus:360,rate:0.5,special:'태양의 축복 · 버닝 시간에는 펫 피해 +40% 추가'},\n        {id:'aion',grade:12,name:'아이온',title:'영겁의 시간왕',ic:'🕰️',bonus:480,rate:0.4,special:'영겁의 순환 · 보스 HP 50% 이하에서 펫 피해 +80%'},\n        {id:'elysium',grade:13,name:'엘리시움',title:'낙원의 절대자',ic:'🏛️',bonus:620,rate:0.3,special:'낙원의 축복 · 전투 중 펫 피해의 5%를 추가 골드로 전환'},\n        {id:'nemesis',grade:14,name:'네메시스',title:'심판의 여왕',ic:'⚔️',bonus:800,rate:0.2,special:'심판의 칼날 · 보스 HP 25% 이하에서 펫 피해 +150%'},\n        {id:'genesis',grade:15,name:'제네시스',title:'창세의 배우자',ic:'🌌',bonus:1050,rate:0.1,special:'창세의 명령 · 10회 공격마다 다음 펫 공격 피해 +300%'}\n      ];\n      const scale=(100-extra.reduce((a,x)=>a+x.rate,0))/SPOUSE_PRESETS.reduce((a,x)=>a+Number(x.rate||0),0);\n      SPOUSE_PRESETS.forEach(x=>x.rate=Number((x.rate*scale).toFixed(4))); extra.forEach(x=>SPOUSE_PRESETS.push(x));\n    }\n  }catch(e){}\n  window.awakenEquip=function(slot,ignoredCost){ const it=S.equip[slot]; if(!it)return; const lv=Number(it.awakening||0); const costs=[10000,50000,100000]; const cost=costs[lv]; if(lv>=3||Number(S.soulStones||0)<cost)return; S.soulStones-=cost; it.awakening=lv+1; if(typeof renderAwakening==='function')renderAwakening(); if(typeof renderAll==='function')renderAll(); saveGame(); toast(`🌠 ${it.name} 각성 ${it.awakening}단계! · 영혼석 ${fmt(cost)} 소모`); };\n  function patchAwakenLabels(){ const p=document.getElementById('awakenPanel'); if(!p)return; const costs=[10000,50000,100000]; p.querySelectorAll('.enhCard').forEach(card=>{ const b=card.querySelector('button[onclick^="awakenEquip"]'); const lvTxt=card.querySelector('.er-top div:last-child'); if(!b||!lvTxt)return; const m=(lvTxt.textContent||'').match(/(\d+)\/3/); if(!m)return; const lv=Number(m[1]); if(lv<3)b.textContent='🌠 각성 · '+fmt(costs[lv])+' 영혼석'; }); }\n  const oldRenderAwaken=window.renderAwakening; if(typeof oldRenderAwaken==='function')window.renderAwakening=function(){oldRenderAwaken.apply(this,arguments);patchAwakenLabels();};\n  const oldRenderSpouse=window.renderSpouse; if(typeof oldRenderSpouse==='function')window.renderSpouse=function(){oldRenderSpouse.apply(this,arguments); const grid=document.getElementById('spouseGrid'); if(!grid||typeof SPOUSE_PRESETS==='undefined')return; grid.querySelectorAll('.spouseCard').forEach((card,i)=>{const sp=SPOUSE_PRESETS[i]; if(sp&&sp.special){const d=card.querySelector('.spouseDesc'); if(d&&!d.querySelector('.spouseSpecial'))d.insertAdjacentHTML('beforeend',`<div class="spouseSpecial" style="margin-top:4px;color:#ffe66d">✦ ${sp.special}</div>`);}}); };\n  const oldPetMult=window.getSpousePetDamageMult; if(typeof oldPetMult==='function')window.getSpousePetDamageMult=function(){ let v=oldPetMult.apply(this,arguments); const sp=typeof getEquippedSpouse==='function'?getEquippedSpouse():null; if(!sp)return v; if(sp.id==='aion'&&S.monster?.isBoss&&S.monster.hp/S.monster.maxHp<=.5)v*=1.8; if(sp.id==='nemesis'&&S.monster?.isBoss&&S.monster.hp/S.monster.maxHp<=.25)v*=2.5; if(sp.id==='genesis'&&Number(S.combatHits||0)%10===0&&S.combatHits>0)v*=4; return v; };\n  function refresh(){try{renderSpouse();}catch(e){} try{renderAwakening();}catch(e){}}\n  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',refresh); else refresh(); setTimeout(refresh,500);\n})();\n</script>\n'''\n          s=s.replace('</body>',patch+'</body>'); p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add www/index.html
          git commit -m '고등급 배우자 5종 및 각성 영혼석 비용 조정' || exit 0
          git push
